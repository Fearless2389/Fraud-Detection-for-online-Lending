[pytest]
# `pythonpath = .` lets tests import `app.*` without an editable install,
# which keeps the setup instructions in the README to two commands.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
filterwarnings =
    error::DeprecationWarning:app.*
